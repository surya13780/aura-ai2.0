<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>JARVIS • Next-Gen AI System</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- 3D Engine & Face AI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    :root {
      --primary-cyan: #00f3ff;
      --primary-magenta: #ff007f;
      --hud-bg: rgba(6, 10, 25, 0.75);
      --hud-border: rgba(0, 243, 255, 0.25);
    }

    body { background-color: #03050d; color: #ffffff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* 3D Arc Reactor Background */
    #bg3d { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    /* JARVIS HUD Grid Lines overlay */
    .hud-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 30%, rgba(3, 5, 13, 0.85) 90%),
                  linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      z-index: 2; pointer-events: none;
    }

    /* Container */
    .app-container { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; max-width: 850px; margin: 0 auto; width: 100%; padding: 10px; }

    /* Glass Header */
    .header {
      background: var(--hud-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--hud-border); border-radius: 20px; margin-bottom: 10px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 800;
      background: linear-gradient(90deg, var(--primary-cyan), var(--primary-magenta));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 2px; text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
    }

    .hud-stats { display: flex; gap: 10px; align-items: center; }
    
    .status-badge {
      background: rgba(0, 243, 255, 0.1); border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan); padding: 6px 14px; border-radius: 20px;
      font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
    }

    .btn-action {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 127, 0.2));
      border: 1px solid var(--primary-cyan); color: #fff; padding: 6px 14px;
      border-radius: 16px; font-family: 'Orbitron', sans-serif; font-size: 0.75rem;
      cursor: pointer; transition: 0.3s;
    }
    .btn-action:hover { background: var(--primary-cyan); color: #000; box-shadow: 0 0 20px var(--primary-cyan); }

    /* Toast Notification Banner */
    .toast-banner {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 243, 255, 0.2); border: 1px solid var(--primary-cyan);
      backdrop-filter: blur(12px); color: #fff; padding: 8px 20px; border-radius: 30px;
      font-family: 'Orbitron', sans-serif; font-size: 0.78rem; letter-spacing: 1px;
      opacity: 0; pointer-events: none; transition: 0.3s ease; z-index: 10;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
    }
    .toast-banner.show { opacity: 1; transform: translateX(-50%) translateY(5px); }

    /* Chat Display */
    .chat-container {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 82%; padding: 14px 20px; border-radius: 20px; font-size: 0.95rem;
      line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s cubic-bezier(0.1, 1, 0.1, 1);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .message.ai {
      background: rgba(10, 20, 45, 0.75); backdrop-filter: blur(16px);
      align-self: flex-start; border-bottom-left-radius: 4px;
      border: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 243, 255, 0.1); color: #e0f7fc;
    }

    .message.user {
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.8), rgba(124, 58, 237, 0.8));
      backdrop-filter: blur(16px); align-self: flex-end; border-bottom-right-radius: 4px;
      border: 1px solid rgba(255, 0, 127, 0.4); box-shadow: 0 8px 25px rgba(255, 0, 127, 0.3);
    }

    /* Input & Control HUD */
    .input-container {
      background: var(--hud-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 12px 18px; display: flex; gap: 10px; align-items: center;
      border: 1px solid var(--hud-border); border-radius: 25px; margin-top: 6px;
      box-shadow: 0 -5px 25px rgba(0, 243, 255, 0.1);
    }

    .input-container input {
      flex: 1; background: rgba(3, 7, 18, 0.8); border: 1px solid rgba(0, 243, 255, 0.2);
      padding: 14px 20px; border-radius: 30px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s;
    }
    .input-container input:focus { border-color: var(--primary-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }

    .control-btn {
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-magenta));
      color: #fff; border: none; width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }
    .control-btn:hover { transform: scale(1.08); }
    .control-btn.listening { background: var(--primary-magenta); animation: pulse 1s infinite; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 0, 127, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 127, 0); } }

    #webcam { display: none; }
  </style>
</head>
<body>

  <!-- 3D Arc Reactor Background & HUD Grid -->
  <canvas id="bg3d"></canvas>
  <div class="hud-overlay"></div>
  <video id="webcam" autoplay muted playsinline width="320" height="240"></video>

  <div class="app-container">
    <!-- Status Toast Notification -->
    <div class="toast-banner" id="toast"><i class="fa-solid fa-atom"></i> <span id="toastMsg">JARVIS OS Online</span></div>

    <!-- JARVIS Header Bar -->
    <div class="header">
      <div class="brand-title"><i class="fa-solid fa-microchip"></i> JARVIS 3.0</div>
      <div class="hud-stats">
        <button class="btn-action" onclick="startCamera()"><i class="fa-solid fa-expand"></i> Scan Biometrics</button>
        <div class="status-badge" id="moodStatus">
          <i class="fa-solid fa-heart-pulse"></i> <span id="currentMood">STABLE</span>
        </div>
      </div>
    </div>

    <!-- Chat Display Area -->
    <div class="chat-container" id="chatBox">
      <div class="message ai">
        Good day, Sir. JARVIS core initialized. All systems operating at peak efficiency. How may I assist you today?
      </div>
    </div>

    <!-- Control HUD -->
    <div class="input-container">
      <button class="control-btn" id="micBtn" onclick="toggleVoiceInput()"><i class="fa-solid fa-microphone"></i></button>
      <input type="text" id="userInput" placeholder="Speak or enter command..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="control-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // 🔑 PASTE YOUR FREE GROQ API KEY HERE:
    const GROQ_API_KEY = "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";

    let detectedMood = "Focused";
    let isListening = false;

    function informUser(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // JARVIS Voice Engine
    function speakOutLoud(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.05;
        utterance.pitch = 0.95; // Slightly lower, authoritative Jarvis voice tone
        window.speechSynthesis.speak(utterance);
      }
    }

    // Speech-to-Text Voice Input
    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return informUser("Voice input unavailable on browser");

      const micBtn = document.getElementById('micBtn');
      const rec = new SpeechRecognition();

      rec.onstart = () => {
        micBtn.classList.add('listening');
        informUser("JARVIS Listening...");
      };

      rec.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        micBtn.classList.remove('listening');
        sendMessage();
      };

      rec.onerror = () => micBtn.classList.remove('listening');
      rec.onend = () => micBtn.classList.remove('listening');

      rec.start();
    }

    // Camera & Emotion Detection
    async function startCamera() {
      informUser("Initializing Biometric Scan...");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        const video = document.getElementById('webcam');
        video.srcObject = stream;
        
        informUser("Loading Neural Models...");
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');

        informUser("Biometrics Active: Tracking Facial Signals");
        
        setInterval(async () => {
          const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
          if (detections && detections.expressions) {
            const expressions = detections.expressions;
            let highest = "focused";
            let maxProb = 0;
            for (const [expr, prob] of Object.entries(expressions)) {
              if (prob > maxProb) { maxProb = prob; highest = expr; }
            }
            detectedMood = highest;
            document.getElementById('currentMood').innerText = highest.toUpperCase();
          }
        }, 2500);

      } catch (err) {
        informUser("Biometric Access Denied");
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      const uDiv = document.createElement('div');
      uDiv.className = 'message user';
      uDiv.innerText = text;
      chatBox.appendChild(uDiv);
      input.value = '';

      informUser("JARVIS Processing Query...");
      const tDiv = document.createElement('div');
      tDiv.className = 'message ai';
      tDiv.id = 'typing';
      tDiv.innerText = "Analyzing telemetry...";
      chatBox.appendChild(tDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Accelerate 3D Arc Reactor pulse speed while thinking
      reactorSpeed = 0.015;

      try {
        const systemInstruction = `You are JARVIS, an elite futuristic AI companion. Address the user respectfully as 'Sir' or by title. The user's biometric telemetry indicates their mood is currently: "${detectedMood}". Respond in 1-2 intelligent, sleek, highly encouraging, and authoritative sentences. If the user mentions being tired, lazy, or unmotivated, explicitly command them with high energy to take immediate action!`;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: systemInstruction },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        document.getElementById('typing').remove();
        reactorSpeed = 0.003; // Return to normal pulse

        if (data.choices && data.choices[0]) {
          const aiReply = data.choices[0].message.content;
          addAiMessage(aiReply);
          speakOutLoud(aiReply);
          informUser("JARVIS Command Executed");
        } else {
          addAiMessage("Sir, please verify that your Groq API key is correctly inserted inside index.html.");
        }

      } catch (err) {
        reactorSpeed = 0.003;
        document.getElementById('typing').remove();
        addAiMessage("Telemetry error: Unable to contact neural network. Please check network configuration.");
      }
    }

    function addAiMessage(text) {
      const chatBox = document.getElementById('chatBox');
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerText = text;
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- 3D ARC REACTOR HUD ENGINE (THREE.JS) ---
    const canvas = document.getElementById('bg3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    let reactorSpeed = 0.003;

    // Glowing Arc Rings
    const ringGroup = new THREE.Group();

    function createHudRing(radius, tube, color, segs) {
      const geo = new THREE.TorusGeometry(radius, tube, 16, segs);
      const mat = new THREE.MeshBasicMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.6 });
      return new THREE.Mesh(geo, mat);
    }

    const innerRing = createHudRing(1.2, 0.02, 0x00f3ff, 32);
    const outerRing = createHudRing(2.0, 0.015, 0xff007f, 24);
    const coreRing  = createHudRing(0.6, 0.03, 0x00f3ff, 16);

    ringGroup.add(innerRing);
    ringGroup.add(outerRing);
    ringGroup.add(coreRing);

    // Dynamic Starfield Particles
    const particleCount = 800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 12;
      positions[i + 1] = (Math.random() - 0.5) * 12;
      positions[i + 2] = (Math.random() - 0.5) * 12;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const pMaterial = new THREE.PointsMaterial({ size: 0.03, color: 0x00f3ff, transparent: true, opacity: 0.7 });
    const particles = new THREE.Points(geometry, pMaterial);

    scene.add(ringGroup);
    scene.add(particles);

    camera.position.z = 4;

    function animate() {
      requestAnimationFrame(animate);
      
      innerRing.rotation.z += reactorSpeed * 2;
      outerRing.rotation.z -= reactorSpeed * 1.5;
      coreRing.rotation.x += reactorSpeed * 3;
      ringGroup.rotation.y += reactorSpeed;
      
      particles.rotation.y += 0.0005;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
