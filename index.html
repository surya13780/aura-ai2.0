<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aura • Your AI Best Friend</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0b0b18; color: #ffffff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    #bg3d { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }
    .app-container { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; padding: 12px; }

    .header {
      background: rgba(22, 22, 45, 0.7); backdrop-filter: blur(16px);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; margin-bottom: 8px;
      box-shadow: 0 8px 32px rgba(168, 85, 247, 0.2);
    }
    .brand-title {
      font-size: 1.1rem; font-weight: 800;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 8px;
    }
    .status-badge {
      background: rgba(168, 85, 247, 0.2); border: 1px solid #a855f7;
      color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
    }
    .btn-action {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border: none; color: #fff; padding: 6px 14px; border-radius: 16px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: 0.3s;
    }

    .toast-banner {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
      background: rgba(168, 85, 247, 0.3); border: 1px solid #a855f7;
      backdrop-filter: blur(12px); color: #fff; padding: 8px 20px; border-radius: 30px;
      font-size: 0.8rem; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.3s ease; z-index: 10;
    }
    .toast-banner.show { opacity: 1; transform: translateX(-50%) translateY(5px); }

    .chat-container { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .message { max-width: 82%; padding: 14px 18px; border-radius: 20px; font-size: 0.93rem; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .message.ai {
      background: rgba(30, 30, 60, 0.75); backdrop-filter: blur(12px);
      align-self: flex-start; border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1); color: #fff;
    }
    .message.user {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      align-self: flex-end; border-bottom-right-radius: 4px;
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.3);
    }

    .input-container {
      background: rgba(22, 22, 45, 0.7); backdrop-filter: blur(16px);
      padding: 10px 16px; display: flex; gap: 8px; align-items: center;
      border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .input-container input {
      flex: 1; background: rgba(15, 15, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 18px; border-radius: 30px; color: #fff; font-size: 0.9rem; outline: none;
    }

    .control-btn {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
    }
    .control-btn.listening { background: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

    #webcam { display: none; }
  </style>
</head>
<body>

  <canvas id="bg3d"></canvas>
  <video id="webcam" autoplay muted playsinline width="320" height="240"></video>

  <div class="app-container">
    <div class="toast-banner" id="toast"><i class="fa-solid fa-sparkles"></i> <span id="toastMsg">Aura Connected</span></div>

    <div class="header">
      <div class="brand-title">✨ Aura • Bestie AI</div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="btn-action" onclick="startCamera()"><i class="fa-solid fa-camera"></i> Scan Mood</button>
        <div class="status-badge" id="currentMood">Happy 😊</div>
      </div>
    </div>

    <div class="chat-container" id="chatBox">
      <div class="message ai">
        Hey bestie! 💕 I'm right here with you! Tell me what you need to do today, ask me to open YouTube or WhatsApp, or tell me when to wake you up!
      </div>
    </div>

    <div class="input-container">
      <button class="control-btn" id="micBtn" onclick="toggleVoiceInput()"><i class="fa-solid fa-microphone"></i></button>
      <input type="text" id="userInput" placeholder="Talk to your bestie..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="control-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // 🔑 PASTE YOUR FREE GROQ API KEY HERE:
    const GROQ_API_KEY = "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";

    let detectedMood = "happy";
    let storedRoutine = localStorage.getItem('aura_routine') || "No schedule added yet.";
    let checkInInterval = null;

    function informUser(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function speakOutLoud(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.15;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Direct Action Parser (Open YouTube, WhatsApp, Alarms, Schedule)
    function parseBestieActions(text) {
      const lower = text.toLowerCase();

      // YouTube Opener Fix
      if (lower.includes("open youtube") || lower.includes("launch youtube")) {
        informUser("Redirecting to YouTube...");
        speakOutLoud("Opening YouTube for you right now, bestie!");
        setTimeout(() => {
          window.location.href = "https://www.youtube.com";
        }, 1200);
        return "Opening YouTube for you right now! Enjoy! 🎬";
      }

      // WhatsApp Opener
      if (lower.includes("open whatsapp") || lower.includes("launch whatsapp")) {
        informUser("Redirecting to WhatsApp...");
        speakOutLoud("Opening WhatsApp Web for you!");
        setTimeout(() => {
          window.location.href = "https://web.whatsapp.com";
        }, 1200);
        return "Redirecting you to WhatsApp Web! 💬";
      }

      // Save Routine
      if (lower.includes("my routine is") || lower.includes("my schedule is")) {
        storedRoutine = text;
        localStorage.setItem('aura_routine', text);
        return "Got it, bestie! I saved your schedule. I'll check in on you from time to time to make sure you stick to it! 💪";
      }

      return null;
    }

    // Automatic Check-in Routine (Runs every 20 minutes)
    function startPeriodicCheckIns() {
      if (checkInInterval) clearInterval(checkInInterval);
      
      // Check in every 20 minutes (1,200,000 ms)
      checkInInterval = setInterval(() => {
        const checkInMsg = `Hey bestie! 💕 Just checking in on you! How are you doing with your routine? Remember your schedule: "${storedRoutine}". Let me know if you need anything!`;
        addAiMessage(checkInMsg);
        speakOutLoud("Hey bestie! Just checking in on you! How's your routine going?");
        informUser("✨ Time-to-time Bestie Check-in");
      }, 1200000);
    }

    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return informUser("Voice recognition unavailable");

      const micBtn = document.getElementById('micBtn');
      const rec = new SpeechRecognition();

      rec.onstart = () => { micBtn.classList.add('listening'); informUser("Aura Listening..."); };
      rec.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        micBtn.classList.remove('listening');
        sendMessage();
      };
      rec.onerror = () => micBtn.classList.remove('listening');
      rec.onend = () => micBtn.classList.remove('listening');
      rec.start();
    }

    async function startCamera() {
      informUser("Scanning face & mood...");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        const video = document.getElementById('webcam');
        video.srcObject = stream;
        
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');

        informUser("Biometrics Active!");
        setInterval(async () => {
          const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
          if (detections && detections.expressions) {
            let highest = "happy";
            let maxProb = 0;
            for (const [expr, prob] of Object.entries(detections.expressions)) {
              if (prob > maxProb) { maxProb = prob; highest = expr; }
            }
            detectedMood = highest;
            document.getElementById('currentMood').innerText = highest.toUpperCase() + " 😊";
          }
        }, 3000);

      } catch (err) { informUser("Camera Access Denied"); }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      const uDiv = document.createElement('div');
      uDiv.className = 'message user';
      uDiv.innerText = text;
      chatBox.appendChild(uDiv);
      input.value = '';

      // Check actions
      const actionReply = parseBestieActions(text);

      informUser("Aura thinking...");
      const tDiv = document.createElement('div');
      tDiv.className = 'message ai';
      tDiv.id = 'typing';
      tDiv.innerText = "Aura is typing...";
      chatBox.appendChild(tDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (actionReply) {
        setTimeout(() => {
          document.getElementById('typing').remove();
          addAiMessage(actionReply);
          speakOutLoud(actionReply);
        }, 500);
        return;
      }

      try {
        const systemInstruction = `You are Aura, the user's ultimate best friend. Speak warmly, energetic, using emojis!
User's Face Mood: "${detectedMood}".
User's Saved Schedule: "${storedRoutine}".
Give a short 1-2 sentence response. If they ask about getting up, hydration, or their schedule, cheer them on and give them affection and high energy!`;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: systemInstruction },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        document.getElementById('typing').remove();

        if (data.choices && data.choices[0]) {
          const aiReply = data.choices[0].message.content;
          addAiMessage(aiReply);
          speakOutLoud(aiReply);
          informUser("Aura replied!");
        } else {
          addAiMessage("Check your Groq API key in index.html!");
        }

      } catch (err) {
        document.getElementById('typing').remove();
        addAiMessage("Connection error! Double check your Groq API key!");
      }
    }

    function addAiMessage(text) {
      const chatBox = document.getElementById('chatBox');
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerText = text;
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Start time-to-time check-ins when page loads
    startPeriodicCheckIns();

    // 3D Scene Background
    const canvas = document.getElementById('bg3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const orbGroup = new THREE.Group();
    const sphereGeo = new THREE.SphereGeometry(1.0, 32, 32);
    const sphereMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, wireframe: true, transparent: true, opacity: 0.8 });
    const orb = new THREE.Mesh(sphereGeo, sphereMat);
    orbGroup.add(orb);

    const ringGeo = new THREE.TorusGeometry(1.8, 0.02, 16, 50);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xec4899, wireframe: true, transparent: true, opacity: 0.6 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    orbGroup.add(ring);

    scene.add(orbGroup);
    camera.position.z = 3.5;

    function animate() {
      requestAnimationFrame(animate);
      orb.rotation.y += 0.005;
      ring.rotation.x += 0.008;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
