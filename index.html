<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aura • Ultimate AI Companion</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0f0f1a; color: #ffffff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    
    .header { background: #16162a; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; background: linear-gradient(135deg, #a855f7, #ec4899); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }
    .header-text select { background: #0f0f1a; color: #a855f7; border: 1px solid #a855f7; padding: 4px 8px; border-radius: 12px; font-weight: 600; font-size: 0.8rem; outline: none; }
    
    .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .message { max-width: 82%; padding: 12px 16px; border-radius: 20px; font-size: 0.93rem; line-height: 1.45; word-wrap: break-word; }
    .message.ai { background: #1e1e38; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
    .message.user { background: linear-gradient(135deg, #8b5cf6, #ec4899); align-self: flex-end; border-bottom-right-radius: 4px; }

    .input-container { background: #16162a; padding: 12px 16px; display: flex; gap: 8px; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
    .input-container input { flex: 1; background: #0f0f1a; border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; border-radius: 25px; color: #fff; font-size: 0.92rem; outline: none; }
    .send-btn { background: #8b5cf6; color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-info">
      <div class="avatar">✨</div>
      <div class="header-text">
        <select id="personaSelect" onchange="changePersonality()">
          <option value="friend">💬 Best Friend</option>
          <option value="mentor">🔥 Strict Mentor</option>
          <option value="fitness">💪 Health Coach</option>
          <option value="tutor">📚 Tutor</option>
        </select>
      </div>
    </div>
  </div>

  <div class="chat-container" id="chatBox">
    <div class="message ai">
      Hey friend! 👋 I'm Aura. Ask me anything, and I'll answer right away!
    </div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Talk to Aura..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <script>
    // 🔑  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
    const GROQ_API_KEY = "PASTE_YOUR_GROQ_API_KEY_HERE";

    const personas = {
      friend: "You are Aura, a warm best friend. Speak casually with emojis in 1-2 sentences.",
      mentor: "You are Aura, a strict mentor. Be direct and push for goals in 1-2 sentences.",
      fitness: "You are Aura, a fitness coach. Offer energetic workout tips in 1-2 sentences.",
      tutor: "You are Aura, a helpful tutor. Explain things clearly in 1-2 sentences."
    };

    let systemPrompt = personas.friend;

    function changePersonality() {
      systemPrompt = personas[document.getElementById('personaSelect').value];
      addAiMessage("Mode updated! What's next?");
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      const uDiv = document.createElement('div');
      uDiv.className = 'message user';
      uDiv.innerText = text;
      chatBox.appendChild(uDiv);
      input.value = '';

      const tDiv = document.createElement('div');
      tDiv.className = 'message ai';
      tDiv.id = 'typing';
      tDiv.innerText = "Aura is thinking...";
      chatBox.appendChild(tDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        document.getElementById('typing').remove();

        if (data.choices && data.choices[0]) {
          addAiMessage(data.choices[0].message.content);
        } else {
          addAiMessage("Please make sure you pasted a valid free Groq API key in the code!");
        }

      } catch (err) {
        document.getElementById('typing').remove();
        addAiMessage("Connection error! Double check your API key in the index.html file.");
      }
    }

    function addAiMessage(text) {
      const chatBox = document.getElementById('chatBox');
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerText = text;
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
