<script>
  // Replace your sendAiPrompt function with this:
  async function sendAiPrompt(userText) {
    const chatBox = document.getElementById('chatBox');
    
    // Add temporary thinking indicator
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message ai';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerText = "Aura is thinking...";
    chatBox.appendChild(typingDiv);
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      // Direct reliable free endpoint
      const prompt = encodeURIComponent(`${currentSystemPrompt} Respond to: ${userText}`);
      const res = await fetch(`https://text.pollinations.ai/${prompt}?model=openai&cache=false`);

      if (!res.ok) throw new Error("API Limit");
      
      const aiReply = await res.text();
      document.getElementById('typingIndicator').remove();
      
      addAiMessage(aiReply);
    } catch (err) {
      document.getElementById('typingIndicator').remove();
      // Friendly fallback answer so the app never crashes or shows raw code/errors
      addAiMessage("I'm here with you! Let's stay focused on your goals today. What's on your mind?");
    }
  }
</script>
