<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>JARVIS • Central 3D Arc Core & Automation</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- 3D Engine & Face AI -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    :root {
      --primary-cyan: #00f3ff;
      --primary-magenta: #ff007f;
      --hud-bg: rgba(4, 8, 20, 0.75);
      --hud-border: rgba(0, 243, 255, 0.3);
    }

    body { background-color: #020308; color: #ffffff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* Central 3D Arc Reactor Background */
    #bg3d { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    /* HUD Overlay Grid */
    .hud-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, transparent 20%, rgba(2, 3, 8, 0.88) 85%),
                  linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                  linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      z-index: 2; pointer-events: none;
    }

    /* Container Layout */
    .app-container { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; max-width: 850px; margin: 0 auto; width: 100%; padding: 12px; }

    /* Header Bar */
    .header {
      background: var(--hud-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      border: 1px solid var(--hud-border); border-radius: 20px; margin-bottom: 8px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900;
      background: linear-gradient(90deg, var(--primary-cyan), #ffffff, var(--primary-magenta));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 2px; text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
    }

    .hud-stats { display: flex; gap: 8px; align-items: center; }
    
    .status-badge {
      background: rgba(0, 243, 255, 0.1); border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan); padding: 5px 12px; border-radius: 20px;
      font-family: 'Orbitron', sans-serif; font-size: 0.7rem; font-weight: 600;
      letter-spacing: 1px; display: flex; align-items: center; gap: 6px;
    }

    .btn-action {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.2), rgba(255, 0, 127, 0.2));
      border: 1px solid var(--primary-cyan); color: #fff; padding: 6px 12px;
      border-radius: 14px; font-family: 'Orbitron', sans-serif; font-size: 0.7rem;
      cursor: pointer; transition: 0.3s;
    }
    .btn-action:hover { background: var(--primary-cyan); color: #000; box-shadow: 0 0 20px var(--primary-cyan); }

    /* Toast Notification Banner */
    .toast-banner {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 243, 255, 0.25); border: 1px solid var(--primary-cyan);
      backdrop-filter: blur(12px); color: #fff; padding: 8px 20px; border-radius: 30px;
      font-family: 'Orbitron', sans-serif; font-size: 0.75rem; letter-spacing: 1px;
      opacity: 0; pointer-events: none; transition: 0.3s ease; z-index: 10;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
    }
    .toast-banner.show { opacity: 1; transform: translateX(-50%) translateY(5px); }

    /* Chat Display Area */
    .chat-container {
      flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 82%; padding: 14px 18px; border-radius: 18px; font-size: 0.92rem;
      line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s cubic-bezier(0.1, 1, 0.1, 1);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .message.ai {
      background: rgba(8, 16, 36, 0.8); backdrop-filter: blur(16px);
      align-self: flex-start; border-bottom-left-radius: 4px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 243, 255, 0.15); color: #e0f7fc;
    }

    .message.user {
      background: linear-gradient(135deg, rgba(255, 0, 127, 0.85), rgba(124, 58, 237, 0.85));
      backdrop-filter: blur(16px); align-self: flex-end; border-bottom-right-radius: 4px;
      border: 1px solid rgba(255, 0, 127, 0.4); box-shadow: 0 8px 25px rgba(255, 0, 127, 0.35);
    }

    /* Controls */
    .input-container {
      background: var(--hud-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 10px 16px; display: flex; gap: 8px; align-items: center;
      border: 1px solid var(--hud-border); border-radius: 25px; margin-top: 4px;
    }

    .input-container input {
      flex: 1; background: rgba(2, 5, 14, 0.85); border: 1px solid rgba(0, 243, 255, 0.25);
      padding: 12px 18px; border-radius: 30px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s;
    }
    .input-container input:focus { border-color: var(--primary-cyan); box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }

    .control-btn {
      background: linear-gradient(135deg, var(--primary-cyan), var(--primary-magenta));
      color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 16px;
      cursor: pointer; transition: 0.3s; box-shadow: 0 0 18px rgba(0, 243, 255, 0.4);
    }
    .control-btn.listening { background: var(--primary-magenta); animation: pulse 1s infinite; }

    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 0, 127, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 127, 0); } }

    #webcam { display: none; }
  </style>
</head>
<body>

  <!-- 3D Central Arc Reactor Canvas -->
  <canvas id="bg3d"></canvas>
  <div class="hud-overlay"></div>
  <video id="webcam" autoplay muted playsinline width="320" height="240"></video>

  <div class="app-container">
    <div class="toast-banner" id="toast"><i class="fa-solid fa-atom"></i> <span id="toastMsg">JARVIS Core Operational</span></div>

    <div class="header">
      <div class="brand-title"><i class="fa-solid fa-compact-disc fa-spin"></i> JARVIS CORE</div>
      <div class="hud-stats">
        <button class="btn-action" onclick="startCamera()"><i class="fa-solid fa-eye"></i> Biometrics</button>
        <div class="status-badge" id="moodStatus">
          <i class="fa-solid fa-heart-pulse"></i> <span id="currentMood">OPTIMAL</span>
        </div>
      </div>
    </div>

    <div class="chat-container" id="chatBox">
      <div class="message ai">
        Greetings, Sir. Central 3D Arc Reactor online. Tell me your schedule, ask me to set an alarm, or tell me to launch WhatsApp!
      </div>
    </div>

    <div class="input-container">
      <button class="control-btn" id="micBtn" onclick="toggleVoiceInput()"><i class="fa-solid fa-microphone"></i></button>
      <input type="text" id="userInput" placeholder="Command JARVIS..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="control-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // 🔑 PASTE YOUR FREE GROQ API KEY HERE:
    const GROQ_API_KEY = "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";

    let detectedMood = "Optimal";
    let storedRoutine = localStorage.getItem('jarvis_routine') || "No routine set yet.";

    function informUser(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function speakOutLoud(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.05;
        utterance.pitch = 0.95;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Voice Command Handler
    function toggleVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return informUser("Voice recognition unavailable");

      const micBtn = document.getElementById('micBtn');
      const rec = new SpeechRecognition();

      rec.onstart = () => { micBtn.classList.add('listening'); informUser("JARVIS Listening..."); };
      rec.onresult = (e) => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        micBtn.classList.remove('listening');
        sendMessage();
      };
      rec.onerror = () => micBtn.classList.remove('listening');
      rec.onend = () => micBtn.classList.remove('listening');
      rec.start();
    }

    // App & Action Automation Parser
    function checkSystemActions(text) {
      const lower = text.toLowerCase();

      // Launch WhatsApp Shortcut
      if (lower.includes("open whatsapp") || lower.includes("launch whatsapp")) {
        informUser("Launching WhatsApp...");
        window.open("https://web.whatsapp.com", "_blank");
        return "Opening WhatsApp for you right now, Sir.";
      }

      // Alarm / Wake-Up Logic
      if (lower.includes("alarm") || lower.includes("wake me up") || lower.includes("get up")) {
        informUser("Setting Internal Wake Alarm...");
        setTimeout(() => {
          speakOutLoud("Sir! Alarm triggered! Time to get up and execute your schedule!");
          alert("⏰ JARVIS ALARM: Time to get up and stay active!");
        }, 5000); // 5 second demo trigger
        return "Alarm system primed, Sir. I will alert and wake you up directly.";
      }

      // Store Daily Routine
      if (lower.includes("my routine is") || lower.includes("my schedule is")) {
        storedRoutine = text;
        localStorage.setItem('jarvis_routine', text);
        return "Routine logged into local memory, Sir. I will keep track of your schedule.";
      }

      return null;
    }

    async function startCamera() {
      informUser("Initializing Biometrics...");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        const video = document.getElementById('webcam');
        video.srcObject = stream;
        
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');

        informUser("Biometrics Active!");
        setInterval(async () => {
          const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
          if (detections && detections.expressions) {
            let highest = "optimal";
            let maxProb = 0;
            for (const [expr, prob] of Object.entries(detections.expressions)) {
              if (prob > maxProb) { maxProb = prob; highest = expr; }
            }
            detectedMood = highest;
            document.getElementById('currentMood').innerText = highest.toUpperCase();
          }
        }, 3500);

      } catch (err) { informUser("Biometric Access Denied"); }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      const uDiv = document.createElement('div');
      uDiv.className = 'message user';
      uDiv.innerText = text;
      chatBox.appendChild(uDiv);
      input.value = '';

      // Check local actions first
      const actionReply = checkSystemActions(text);

      informUser("Processing Neural Core...");
      const tDiv = document.createElement('div');
      tDiv.className = 'message ai';
      tDiv.id = 'typing';
      tDiv.innerText = "Analyzing query...";
      chatBox.appendChild(tDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Pulse Arc Reactor faster when thinking
      corePulseSpeed = 0.03;

      if (actionReply) {
        setTimeout(() => {
          document.getElementById('typing').remove();
          corePulseSpeed = 0.005;
          addAiMessage(actionReply);
          speakOutLoud(actionReply);
        }, 800);
        return;
      }

      try {
        const systemInstruction = `You are JARVIS, an elite futuristic AI assistant. Address the user as 'Sir'. 
User's Biometric Mood: "${detectedMood}".
User's Saved Daily Routine: "${storedRoutine}".
Respond in 1-2 powerful, clear sentences. If they sound tired or ask about getting up/health, order them explicitly to get up, hydrate, and conquer their daily routine!`;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: systemInstruction },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        document.getElementById('typing').remove();
        corePulseSpeed = 0.005;

        if (data.choices && data.choices[0]) {
          const aiReply = data.choices[0].message.content;
          addAiMessage(aiReply);
          speakOutLoud(aiReply);
          informUser("JARVIS Command Executed");
        } else {
          addAiMessage("Sir, please verify your Groq API key in index.html.");
        }

      } catch (err) {
        corePulseSpeed = 0.005;
        document.getElementById('typing').remove();
        addAiMessage("Telemetry warning: Unable to communicate with core API.");
      }
    }

    function addAiMessage(text) {
      const chatBox = document.getElementById('chatBox');
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerText = text;
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- REALISTIC CENTRAL 3D ARC REACTOR WITH SPARKS (THREE.JS) ---
    const canvas = document.getElementById('bg3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    let corePulseSpeed = 0.005;

    // Central Spinning Arc Reactor Group
    const arcGroup = new THREE.Group();

    // Core Glowing Sphere
    const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff, wireframe: true, transparent: true, opacity: 0.9 });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    arcGroup.add(coreMesh);

    // Glowing Inner & Outer Segmented HUD Rings
    function makeRing(r, tube, color, segs) {
      const g = new THREE.TorusGeometry(r, tube, 16, segs);
      const m = new THREE.MeshBasicMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.7 });
      return new THREE.Mesh(g, m);
    }

    const ring1 = makeRing(1.2, 0.03, 0x00f3ff, 28);
    const ring2 = makeRing(1.8, 0.02, 0xff007f, 20);
    const ring3 = makeRing(2.4, 0.015, 0x00f3ff, 36);

    arcGroup.add(ring1);
    arcGroup.add(ring2);
    arcGroup.add(ring3);

    // Dynamic Electric Sparks & Particles
    const sparkCount = 400;
    const sparkGeo = new THREE.BufferGeometry();
    const sparkPos = new Float32Array(sparkCount * 3);

    for (let i = 0; i < sparkCount * 3; i += 3) {
      sparkPos[i] = (Math.random() - 0.5) * 6;
      sparkPos[i + 1] = (Math.random() - 0.5) * 6;
      sparkPos[i + 2] = (Math.random() - 0.5) * 6;
    }

    sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
    const sparkMat = new THREE.PointsMaterial({ size: 0.04, color: 0x00f3ff, transparent: true, opacity: 0.85 });
    const sparkSystem = new THREE.Points(sparkGeo, sparkMat);

    arcGroup.add(sparkSystem);
    scene.add(arcGroup);

    camera.position.z = 4.2;

    // Animation Render Loop
    function animate() {
      requestAnimationFrame(animate);

      // Rotate Rings around Center Axis
      ring1.rotation.z += corePulseSpeed * 2;
      ring2.rotation.z -= corePulseSpeed * 2.5;
      ring3.rotation.x += corePulseSpeed * 1.5;
      
      coreMesh.rotation.y += corePulseSpeed * 3;
      arcGroup.rotation.y += corePulseSpeed;

      // Realistic pulse scale
      const scale = 1 + Math.sin(Date.now() * 0.003) * 0.05;
      coreMesh.scale.set(scale, scale, scale);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
