<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aura • 3D AI Companion with Mood Detection</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- 3D Engine & Face AI Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #080811; color: #ffffff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* 3D Background Canvas */
    #bg3d { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    /* Container */
    .app-container { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; }

    /* Glass Header */
    .header { background: rgba(18, 18, 35, 0.65); backdrop-filter: blur(16px); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 44px; height: 44px; background: linear-gradient(135deg, #8b5cf6, #ec4899); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }
    
    /* Camera & Mood Badge */
    .mood-box { background: rgba(139, 92, 246, 0.2); border: 1px solid #8b5cf6; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
    .cam-btn { background: #8b5cf6; color: #fff; border: none; padding: 6px 12px; border-radius: 12px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }

    /* Toast Notification Banner */
    .toast-banner { position: absolute; top: 75px; left: 50%; transform: translateX(-50%); background: rgba(139, 92, 246, 0.3); border: 1px solid rgba(139, 92, 246, 0.5); backdrop-filter: blur(10px); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; opacity: 0; pointer-events: none; transition: 0.3s ease; z-index: 10; }
    .toast-banner.show { opacity: 1; transform: translateX(-50%) translateY(5px); }

    /* Chat Area */
    .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 14px 18px; border-radius: 22px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .message.ai { background: rgba(28, 28, 52, 0.7); backdrop-filter: blur(12px); align-self: flex-start; border-bottom-left-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.08); }
    .message.user { background: linear-gradient(135deg, #7c3aed, #db2777); align-self: flex-end; border-bottom-right-radius: 6px; }

    /* Hidden Camera Frame */
    #webcam { display: none; }

    /* Input Box */
    .input-container { background: rgba(18, 18, 35, 0.65); backdrop-filter: blur(16px); padding: 14px 20px; display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .input-container input { flex: 1; background: rgba(10, 10, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); padding: 14px 20px; border-radius: 30px; color: #fff; font-size: 0.95rem; outline: none; }
    .send-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; border: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 3D Canvas -->
  <canvas id="bg3d"></canvas>
  <video id="webcam" autoplay muted playsinline width="320" height="240"></video>

  <div class="app-container">
    <div class="toast-banner" id="toast"><i class="fa-solid fa-circle-info"></i> <span id="toastMsg">System Online</span></div>

    <div class="header">
      <div class="user-info">
        <div class="avatar">✨</div>
        <button class="cam-btn" onclick="startCamera()"><i class="fa-solid fa-camera"></i> Scan Mood</button>
      </div>
      <div class="mood-box" id="moodStatus">
        <i class="fa-solid fa-face-smile"></i> Mood: <span id="currentMood">Neutral</span>
      </div>
    </div>

    <div class="chat-container" id="chatBox">
      <div class="message ai">
        Hey! 👋 I'm Aura. Tap 'Scan Mood' to let me read your expression, or just speak to me!
      </div>
    </div>

    <div class="input-container">
      <input type="text" id="userInput" placeholder="Talk to Aura..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // 🔑 PASTE YOUR FREE GROQ API KEY HERE:
    const GROQ_API_KEY = "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";

    let detectedMood = "neutral";

    function informUser(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Voice Engine (AI Speaks out loud)
    function speakOutLoud(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop old audio
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Camera & Emotion Detection
    async function startCamera() {
      informUser("Loading Face Detection AI...");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
        const video = document.getElementById('webcam');
        video.srcObject = stream;
        
        informUser("Downloading emotion models...");
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        await faceapi.nets.faceExpressionNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');

        informUser("Camera Active! Reading your face...");
        
        setInterval(async () => {
          const detections = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
          if (detections && detections.expressions) {
            const expressions = detections.expressions;
            let highest = "neutral";
            let maxProb = 0;
            for (const [expr, prob] of Object.entries(expressions)) {
              if (prob > maxProb) { maxProb = prob; highest = expr; }
            }
            detectedMood = highest;
            document.getElementById('currentMood').innerText = highest.toUpperCase();
          }
        }, 2000);

      } catch (err) {
        informUser("Camera permission denied!");
      }
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      const uDiv = document.createElement('div');
      uDiv.className = 'message user';
      uDiv.innerText = text;
      chatBox.appendChild(uDiv);
      input.value = '';

      informUser("Aura thinking...");
      const tDiv = document.createElement('div');
      tDiv.className = 'message ai';
      tDiv.id = 'typing';
      tDiv.innerText = "Aura is typing...";
      chatBox.appendChild(tDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const systemInstruction = `You are Aura, an energetic AI companion. The user's face camera detects their mood is currently: "${detectedMood}". Respond in 1-2 motivating sentences. If they sound lazy, explicitly order them: "Get up right now, let's achieve our goals!"`;

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: systemInstruction },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        document.getElementById('typing').remove();

        if (data.choices && data.choices[0]) {
          const aiReply = data.choices[0].message.content;
          addAiMessage(aiReply);
          speakOutLoud(aiReply); // 🔊 SPEAKS OUT LOUD
          informUser("Aura Responded!");
        } else {
          addAiMessage("Check your Groq API key in index.html!");
        }

      } catch (err) {
        document.getElementById('typing').remove();
        addAiMessage("Connection error. Check index.html API key!");
      }
    }

    function addAiMessage(text) {
      const chatBox = document.getElementById('chatBox');
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerText = text;
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- 3D THREE.JS PARTICLES BACKGROUND ---
    const canvas = document.getElementById('bg3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    const particleCount = 600;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 10;
      positions[i + 1] = (Math.random() - 0.5) * 10;
      positions[i + 2] = (Math.random() - 0.5) * 10;
      colors[i] = Math.random() * 0.5 + 0.5;
      colors[i + 1] = Math.random() * 0.2;
      colors[i + 2] = Math.random() * 0.8 + 0.2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0.8 });
    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);
    camera.position.z = 3;

    function animate() {
      requestAnimationFrame(animate);
      particleSystem.rotation.x += 0.0008;
      particleSystem.rotation.y += 0.0012;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
