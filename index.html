<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aura • 3D AI Companion</title>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Three.js Library for Real 3D Background -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #080811; color: #ffffff; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; }

    /* 3D Canvas Background */
    #bg3d { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; pointer-events: none; }

    /* UI Layout Wrapper */
    .app-container { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; }

    /* Glassmorphism Header */
    .header { background: rgba(18, 18, 35, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 44px; height: 44px; background: linear-gradient(135deg, #8b5cf6, #ec4899); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); border: 2px solid rgba(255, 255, 255, 0.2); }
    .persona-select { background: rgba(15, 15, 26, 0.8); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; outline: none; cursor: pointer; transition: 0.3s ease; }
    .persona-select:hover { border-color: #c084fc; box-shadow: 0 0 10px rgba(192, 132, 252, 0.3); }

    /* Toast Notification Banner (Always Informs You) */
    .toast-banner { position: absolute; top: 75px; left: 50%; transform: translateX(-50%); background: rgba(139, 92, 246, 0.25); border: 1px solid rgba(139, 92, 246, 0.5); backdrop-filter: blur(10px); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; z-index: 10; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }
    .toast-banner.show { opacity: 1; transform: translateX(-50%) translateY(5px); }

    /* Chat Area */
    .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
    .message { max-width: 80%; padding: 14px 18px; border-radius: 22px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s cubic-bezier(0.1, 1, 0.1, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .message.ai { background: rgba(28, 28, 52, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); align-self: flex-start; border-bottom-left-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
    .message.user { background: linear-gradient(135deg, #7c3aed, #db2777); align-self: flex-end; border-bottom-right-radius: 6px; box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4); }

    /* Input Controls */
    .input-container { background: rgba(18, 18, 35, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 14px 20px; display: flex; gap: 10px; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .input-container input { flex: 1; background: rgba(10, 10, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.12); padding: 14px 20px; border-radius: 30px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.3s ease; }
    .input-container input:focus { border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
    .send-btn { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; border: none; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.3s ease; box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
    .send-btn:hover { transform: scale(1.05); }

    /* Custom Scrollbar */
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
  </style>
</head>
<body>

  <!-- 3D Particle Canvas Background -->
  <canvas id="bg3d"></canvas>

  <div class="app-container">
    <!-- Status Toast Informing You of Events -->
    <div class="toast-banner" id="toast"><i class="fa-solid fa-circle-info"></i> <span id="toastMsg">System Ready</span></div>

    <div class="header">
      <div class="user-info">
        <div class="avatar">✨</div>
        <select class="persona-select" id="personaSelect" onchange="changePersonality()">
          <option value="friend">💬 Best Friend</option>
          <option value="mentor">🔥 Strict Mentor</option>
          <option value="fitness">💪 Health Coach</option>
          <option value="tutor">📚 Tutor</option>
        </select>
      </div>
    </div>

    <div class="chat-container" id="chatBox">
      <div class="message ai">
        Greetings! 👋 I am Aura, your classic AI companion. I'm connected and ready to assist you!
      </div>
    </div>

    <div class="input-container">
      <input type="text" id="userInput" placeholder="Talk to Aura..." onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    // 🔑 PASTE YOUR FREE GROQ API KEY HERE:
    const GROQ_API_KEY = "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";

    const personas = {
      friend: "You are Aura, a warm best friend. Speak casually with emojis in 1-2 friendly sentences.",
      mentor: "You are Aura, a strict mentor. Be direct and push the user towards their goals in 1-2 sentences.",
      fitness: "You are Aura, a high-energy fitness coach. Give motivating workout tips in 1-2 sentences.",
      tutor: "You are Aura, an intelligent tutor. Explain concepts clearly and concisely in 1-2 sentences."
    };

    let systemPrompt = personas.friend;

    // Toast Notification Function (Always Informs You)
    function informUser(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function changePersonality() {
      const selected = document.getElementById('personaSelect').value;
      systemPrompt = personas[selected];
      informUser(`Mode changed to: ${selected.toUpperCase()}`);
      addAiMessage(`Switched persona mode! How can I help you now?`);
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      
      // User Message
      const uDiv = document.createElement('div');
      uDiv.className = 'message user';
      uDiv.innerText = text;
      chatBox.appendChild(uDiv);
      input.value = '';

      // Typing Indicator + Inform User
      informUser("Aura is processing response...");
      const tDiv = document.createElement('div');
      tDiv.className = 'message ai';
      tDiv.id = 'typing';
      tDiv.innerText = "Aura is thinking...";
      chatBox.appendChild(tDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: text }
            ]
          })
        });

        const data = await response.json();
        document.getElementById('typing').remove();

        if (data.choices && data.choices[0]) {
          addAiMessage(data.choices[0].message.content);
          informUser("Response received!");
        } else {
          addAiMessage("API Key missing or invalid. Please add your Groq API Key to index.html.");
          informUser("API Key error!");
        }

      } catch (err) {
        document.getElementById('typing').remove();
        addAiMessage("Unable to establish connection. Please check your API key in index.html.");
        informUser("Connection failed!");
      }
    }

    function addAiMessage(text) {
      const chatBox = document.getElementById('chatBox');
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerText = text;
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // --- 3D THREE.JS PARTICLES BACKGROUND ---
    const canvas = document.getElementById('bg3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Particles Geometry
    const particleCount = 700;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 10;
      positions[i + 1] = (Math.random() - 0.5) * 10;
      positions[i + 2] = (Math.random() - 0.5) * 10;

      // Classic glowing colors (Purple / Pink / Blue)
      colors[i] = Math.random() * 0.5 + 0.5; // Red
      colors[i + 1] = Math.random() * 0.2;     // Green
      colors[i + 2] = Math.random() * 0.8 + 0.2; // Blue
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.04,
      vertexColors: true,
      transparent: true,
      opacity: 0.8
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    camera.position.z = 3;

    // Smooth Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      particleSystem.rotation.x += 0.0008;
      particleSystem.rotation.y += 0.0012;
      renderer.render(scene, camera);
    }
    animate();

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
