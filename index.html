<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aura • Ultimate AI Companion</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: #0f0f1a; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Header & Personality Selector */
    .header { background: #16162a; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .user-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; background: linear-gradient(135deg, #a855f7, #ec4899); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }
    .header-text select { background: #0f0f1a; color: #a855f7; border: 1px solid #a855f7; padding: 4px 8px; border-radius: 12px; font-weight: 600; font-size: 0.8rem; outline: none; cursor: pointer; }
    
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { background: rgba(255,255,255,0.08); color: #fff; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn.active { background: #ec4899; color: #fff; }

    /* Daily Planner Drawer */
    .planner-panel { background: #1a1a32; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); display: none; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; }
    .planner-panel.show { display: flex; }
    .planner-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 700; color: #c084fc; }
    .task-input-box { display: flex; gap: 6px; }
    .task-input-box input { flex: 1; background: #0f0f1a; border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px; color: #fff; font-size: 0.8rem; outline: none; }
    .task-input-box button { background: #8b5cf6; color: #fff; border: none; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; }
    .task-item.completed { text-decoration: line-through; opacity: 0.5; }

    /* Camera View Modal */
    .cam-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
    .cam-modal.show { display: flex; }
    video { width: 100%; max-width: 400px; border-radius: 16px; background: #222; }
    .cam-controls { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
    .snap-btn { width: 64px; height: 64px; border-radius: 50%; background: #ec4899; border: 4px solid #fff; cursor: pointer; }
    .close-cam { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; }

    /* Chat Container */
    .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .message { max-width: 82%; padding: 12px 16px; border-radius: 20px; font-size: 0.93rem; line-height: 1.45; word-wrap: break-word; }
    .message.ai { background: #1e1e38; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
    .message.user { background: linear-gradient(135deg, #8b5cf6, #ec4899); align-self: flex-end; border-bottom-right-radius: 4px; }
    .message img { width: 100%; border-radius: 12px; margin-bottom: 8px; }

    /* Input Controls */
    .input-container { background: #16162a; padding: 12px 16px; display: flex; gap: 8px; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
    .input-container input { flex: 1; background: #0f0f1a; border: 1px solid rgba(255,255,255,0.1); padding: 12px 16px; border-radius: 25px; color: #fff; font-size: 0.92rem; outline: none; }
    .send-btn { background: #8b5cf6; color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
    .mic-btn { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; border: 1px solid #8b5cf6; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; }
    .mic-btn.listening { background: #ef4444; color: #fff; border-color: #ef4444; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="user-info">
      <div class="avatar">✨</div>
      <div class="header-text">
        <select id="personaSelect" onchange="changePersonality()">
          <option value="friend">💬 Best Friend</option>
          <option value="mentor">🔥 Strict Mentor</option>
          <option value="fitness">💪 Health & Gym Coach</option>
          <option value="tutor">📚 Productivity Tutor</option>
        </select>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="togglePlanner()" title="Daily Planner"><i class="fa-solid fa-calendar-check"></i></button>
      <button class="icon-btn" onclick="openCamera()" title="Mood/Camera Scanner"><i class="fa-solid fa-camera"></i></button>
      <button class="icon-btn" id="voiceToggle" onclick="toggleSpeechOutput()" title="Toggle Voice Output"><i class="fa-solid fa-volume-high"></i></button>
    </div>
  </div>

  <!-- Daily Planner Panel -->
  <div class="planner-panel" id="plannerPanel">
    <div class="planner-header">
      <span><i class="fa-solid fa-list-check"></i> Smart Daily Routine</span>
      <span style="font-size: 0.75rem; color: #8f8fa8;">Track habits</span>
    </div>
    <div class="task-input-box">
      <input type="text" id="newTaskInput" placeholder="Add task (e.g. Study at 5 PM)" />
      <button onclick="addTask()">Add</button>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </div>

  <!-- Camera Scanner Modal -->
  <div class="cam-modal" id="camModal">
    <h3 style="color:#fff; margin-top:20px;">Aura Mood & Vision Scanner</h3>
    <video id="webcam" autoplay playsinline></video>
    <div class="cam-controls">
      <button class="close-cam" onclick="closeCamera()">Cancel</button>
      <button class="snap-btn" onclick="captureAndAnalyze()"></button>
    </div>
  </div>

  <!-- Chat Container -->
  <div class="chat-container" id="chatBox">
    <div class="message ai" id="welcomeMsg">
      Hey friend! 👋 I'm Aura. I can listen, speak back to you, track your daily routine, and scan your mood with your camera! What are we doing today?
    </div>
  </div>

  <!-- Input Controls -->
  <div class="input-container">
    <button class="mic-btn" id="micBtn" onclick="toggleSpeechRecognition()"><i class="fa-solid fa-microphone"></i></button>
    <input type="text" id="userInput" placeholder="Talk or type to Aura..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    // Personalities
    const personalities = {
      friend: "You are Aura, a warm, supportive best friend. Speak casually with emojis, keep answers brief (2-3 sentences), and be empathetic.",
      mentor: "You are Aura acting as a strict, relentless mentor. Push the user to get things done, give zero excuses, and hold them accountable in 2-3 firm sentences.",
      fitness: "You are Aura, an energetic fitness & health coach. Focus on energy, workouts, diet, hydration, and active habits in 2-3 motivational sentences.",
      tutor: "You are Aura, a smart productivity and study tutor. Help break down tasks efficiently, organize time, and give clear advice in 2-3 sentences."
    };

    let currentSystemPrompt = personalities.friend;
    let speakOutput = true;
    let messages = [{ role: "system", content: currentSystemPrompt }];
    let tasks = JSON.parse(localStorage.getItem('AURA_TASKS') || '[]');

    // Initialize Tasks
    renderTasks();

    function changePersonality() {
      const selected = document.getElementById('personaSelect').value;
      currentSystemPrompt = personalities[selected];
      messages = [{ role: "system", content: currentSystemPrompt }];
      addAiMessage(`Personality switched to ${document.getElementById('personaSelect').options[document.getElementById('personaSelect').selectedIndex].text}! How can I help you now?`);
    }

    function togglePlanner() {
      const panel = document.getElementById('plannerPanel');
      panel.classList.toggle('show');
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      if (!input.value.trim()) return;
      tasks.push({ text: input.value.trim(), done: false });
      localStorage.setItem('AURA_TASKS', JSON.stringify(tasks));
      input.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      localStorage.setItem('AURA_TASKS', JSON.stringify(tasks));
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      localStorage.setItem('AURA_TASKS', JSON.stringify(tasks));
      renderTasks();
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = `task-item ${t.done ? 'completed' : ''}`;
        li.innerHTML = `
          <span onclick="toggleTask(${i})" style="cursor:pointer;">${t.done ? '✅' : '⚪'} ${t.text}</span>
          <i class="fa-solid fa-trash" style="color:#ef4444; cursor:pointer;" onclick="deleteTask(${i})"></i>
        `;
        list.appendChild(li);
      });
    }

    // Voice Output Toggle
    function toggleSpeechOutput() {
      speakOutput = !speakOutput;
      const btn = document.getElementById('voiceToggle');
      btn.classList.toggle('active', speakOutput);
      alert(speakOutput ? "Voice responses enabled 🔊" : "Voice responses muted 🔇");
    }

    function speakText(text) {
      if (!speakOutput || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.1;
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // Speech Recognition (Listening)
    let recognition;
    function toggleSpeechRecognition() {
      const micBtn = document.getElementById('micBtn');
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert("Speech recognition is not supported on this browser.");
        return;
      }

      if (recognition && micBtn.classList.contains('listening')) {
        recognition.stop();
        micBtn.classList.remove('listening');
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => micBtn.classList.add('listening');
      recognition.onend = () => micBtn.classList.remove('listening');
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        sendMessage();
      };

      recognition.start();
    }

    // Camera Scanner
    let stream;
    async function openCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('webcam').srcObject = stream;
        document.getElementById('camModal').classList.add('show');
      } catch (err) {
        alert("Camera permission denied or unavailable!");
      }
    }

    function closeCamera() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      document.getElementById('camModal').classList.remove('show');
    }

    function captureAndAnalyze() {
      const video = document.getElementById('webcam');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const imgData = canvas.toDataURL('image/jpeg');

      closeCamera();

      // Show photo in chat
      const chatBox = document.getElementById('chatBox');
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerHTML = `<img src="${imgData}" /><br>📸 [Scanned photo sent to Aura]`;
      chatBox.appendChild(userDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Prompt Aura about the photo
      sendAiPrompt("I just snapped a photo for you! Give me a friendly comment, guess my mood from my expression, or give me positive encouragement!");
    }

    // Messaging Logic
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerText = text;
      chatBox.appendChild(userDiv);
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      sendAiPrompt(text);
    }

    async function sendAiPrompt(userText) {
      const chatBox = document.getElementById('chatBox');
      messages.push({ role: "user", content: userText });

      const typingDiv = document.createElement('div');
      typingDiv.className = 'message ai';
      typingDiv.id = 'typingIndicator';
      typingDiv.innerText = "Aura is thinking...";
      chatBox.appendChild(typingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("https://text.pollinations.ai/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: messages, model: "openai" })
        });

        const aiReply = await response.text();
        document.getElementById('typingIndicator').remove();
        
        addAiMessage(aiReply);
        messages.push({ role: "assistant", content: aiReply });

      } catch (err) {
        document.getElementById('typingIndicator').remove();
        addAiMessage("Oops! Connection hiccup. Try typing again!");
      }
    }

    function addAiMessage(text) {
      const chatBox = document.getElementById('chatBox');
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerText = text;
      chatBox.appendChild(aiDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      speakText(text);
    }
  </script>
</body>
</html>
